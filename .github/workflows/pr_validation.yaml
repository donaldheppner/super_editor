      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-mac-j2-b
          path: super_editor/ci_report.json

  mac_j3_a:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./super_editor
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: sysctl -n hw.ncpu hw.memsize hw.model && sysctl vm.swapusage
      - run: flutter pub get
      - run: flutter test -j 3 --file-reporter=json:ci_report.json
      - name: Memory after
        if: always()
        run: sysctl vm.swapusage && vm_stat
      - name: Summarise timings
        if: always()
        run: dart run ci_timings.dart ci_report.json mac_j3_a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-mac-j3-a
          path: super_editor/ci_report.json

  mac_j3_b:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./super_editor
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: sysctl -n hw.ncpu hw.memsize hw.model && sysctl vm.swapusage
      - run: flutter pub get
      - run: flutter test -j 3 --file-reporter=json:ci_report.json
      - name: Memory after
        if: always()
