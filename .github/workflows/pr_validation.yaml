name: Test project in a PR

# THROWAWAY BRANCH (MemNote NOTE-179), third push. Runs 1 and 2 settled the cause
# (macos-latest is 3-core, so package:test's `max(1, nproc ~/ 2)` default gave
# concurrency 1 and the suite ran serially). They disagreed on whether -j 2 or -j 3
# is the better setting, so this push is paired replicates of just those two, with
# swap/memory readings to explain -j 3's per-test inflation. No linux/windows job and
# no clone builds: the sibling PRs need those runners. DO NOT MERGE.
on: [pull_request]

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  mac_j2_a:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./super_editor
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: sysctl -n hw.ncpu hw.memsize hw.model && sysctl vm.swapusage
      - run: flutter pub get
      - run: flutter test -j 2 --file-reporter=json:ci_report.json
      - name: Memory after
        if: always()
        run: sysctl vm.swapusage && vm_stat
      - name: Summarise timings
        if: always()
        run: dart run ci_timings.dart ci_report.json mac_j2_a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-mac-j2-a
          path: super_editor/ci_report.json

  mac_j2_b:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./super_editor
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: sysctl -n hw.ncpu hw.memsize hw.model && sysctl vm.swapusage
      - run: flutter pub get
      - run: flutter test -j 2 --file-reporter=json:ci_report.json
      - name: Memory after
        if: always()
