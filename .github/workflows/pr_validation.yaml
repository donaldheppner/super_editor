name: Test project in a PR

# THROWAWAY BRANCH (MemNote NOTE-179). Stripped to the three `super_editor` test jobs
# plus two `-j` variants of the mac job, so the measurement does not queue macOS
# runners the sibling PRs need. DO NOT MERGE.
on: [pull_request]

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  test_mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./super_editor
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Runner facts
        run: |
          echo "### runner facts: mac (default -j)"
          sysctl -n hw.ncpu hw.physicalcpu hw.logicalcpu hw.memsize hw.model
          uname -m
      - run: flutter pub get
      - run: flutter test --file-reporter=json:ci_report.json
      - name: Summarise timings
        if: always()
        run: dart run ci_timings.dart ci_report.json mac_default
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-mac-default
          path: super_editor/ci_report.json

  test_mac_j2:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./super_editor
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Runner facts
        run: |
          echo "### runner facts: mac (-j 2)"
          sysctl -n hw.ncpu hw.physicalcpu hw.logicalcpu hw.memsize hw.model
          uname -m
      - run: flutter pub get
      - run: flutter test -j 2 --file-reporter=json:ci_report.json
      - name: Summarise timings
        if: always()
        run: dart run ci_timings.dart ci_report.json mac_j2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-mac-j2
          path: super_editor/ci_report.json

  test_mac_j3:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./super_editor
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Runner facts
        run: |
          echo "### runner facts: mac (-j 3)"
          sysctl -n hw.ncpu hw.physicalcpu hw.logicalcpu hw.memsize hw.model
          uname -m
      - run: flutter pub get
      - run: flutter test -j 3 --file-reporter=json:ci_report.json
      - name: Summarise timings
        if: always()
        run: dart run ci_timings.dart ci_report.json mac_j3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-mac-j3
          path: super_editor/ci_report.json

  test_windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./super_editor
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Runner facts
        run: |
          echo "### runner facts: windows"
          echo "NUMBER_OF_PROCESSORS=$env:NUMBER_OF_PROCESSORS"
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List
        shell: pwsh
      - run: flutter pub get
      - run: flutter test --file-reporter=json:ci_report.json
      - name: Summarise timings
        if: always()
        run: dart run ci_timings.dart ci_report.json windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-windows
          path: super_editor/ci_report.json

  test_linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./super_editor
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Runner facts
        run: |
          echo "### runner facts: linux"
          nproc
          lscpu | head -20
          free -m
      - run: flutter pub get
      - run: flutter test --file-reporter=json:ci_report.json
      - name: Summarise timings
        if: always()
        run: dart run ci_timings.dart ci_report.json linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-linux
          path: super_editor/ci_report.json
