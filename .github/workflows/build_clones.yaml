name: Build Clones
on: [pull_request]

# MemNote fork (NOTE-165): this fork pins the Flutter SDK instead of tracking the
# "master" channel that upstream uses. See the CI section of FORK_PATCHES.md for why.
# Bump FLUTTER_VERSION here and in pr_validation.yaml whenever MemNote's toolchain moves.
env:
  FLUTTER_VERSION: "3.47.2"

# MemNote fork (NOTE-177): the clones that have a `test/` directory run it here, as a
# `flutter test` step in their own build job - the SDK and `pub get` are already paid for,
# so the tests cost seconds. Today that is obsidian (1 test) and quill (10). The other
# four clones in this workflow - bear, google_docs, medium, slack - have no tests at all,
# so their job proves only that they still compile. If you add a `test/` directory to one
# of them, add the step here too; nothing else in this repo runs a clone's tests.

jobs:
  build_bear:
    runs-on: macos-latest
    defaults:
      run:
        # Run everything from within the bear project directory
        working-directory: ./super_clones/bear
    steps:
      # Checkout the PR branch
      - uses: actions/checkout@v3

      # Setup Flutter environment
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Download all the packages that the app uses
      - run: flutter pub get

      # Build the clone
      - run: flutter build macos --debug

  build_google_docs:
    runs-on: macos-latest
    defaults:
      run:
        # Run everything from within the google_docs project directory
        working-directory: ./super_clones/google_docs
    steps:
      # Checkout the PR branch
      - uses: actions/checkout@v3

      # Setup Flutter environment
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Download all the packages that the app uses
      - run: flutter pub get

      # Build the clone
      - run: flutter build macos --debug

  build_medium:
    runs-on: macos-latest
    defaults:
      run:
        # Run everything from within the medium project directory
        working-directory: ./super_clones/medium
    steps:
      # Checkout the PR branch
      - uses: actions/checkout@v3

      # Setup Flutter environment
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Download all the packages that the app uses
      - run: flutter pub get

      # Build the clone
      - run: flutter build web --debug

  build_obsidian:
    runs-on: macos-latest
    defaults:
      run:
        # Run everything from within the obsidian project directory
        working-directory: ./super_clones/obsidian
    steps:
      # Checkout the PR branch
      - uses: actions/checkout@v3

      # Setup Flutter environment
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Download all the packages that the app uses
      - run: flutter pub get

      # Run the clone's tests (MemNote NOTE-177)
      - run: flutter test

      # Build the clone
      - run: flutter build macos --debug

  build_slack:
    runs-on: macos-latest
    defaults:
      run:
        # Run everything from within the slack project directory
        working-directory: ./super_clones/slack
    steps:
      # Checkout the PR branch
      - uses: actions/checkout@v3

      # Setup Flutter environment
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Download all the packages that the app uses
      - run: flutter pub get

      # Build the clone
      - run: flutter build macos --debug

  build_quill:
    runs-on: macos-latest
    defaults:
      run:
        # Run everything from within the quill project directory
        working-directory: ./super_clones/quill
    steps:
      # Checkout the PR branch
      - uses: actions/checkout@v3

      # Setup Flutter environment
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Download all the packages that the app uses
      - run: flutter pub get

      # Run the clone's tests (MemNote NOTE-177)
      - run: flutter test

      # Build the clone
      - run: flutter build macos --debug
